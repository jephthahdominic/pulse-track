<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PulseTrack — Website monitoring center and dashboard</title>
    <meta name="description" content="PulseTrack is a website monitoring center and dashboard: live visitors, performance, errors and user behaviour in one place." />
    <meta name="theme-color" content="#0b1a38" />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="PulseTrack — Website monitoring center and dashboard" />
    <meta property="og:description" content="Live visitors, performance, errors and user behaviour in one place." />
    <meta property="og:image" content="/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og-image.jpg" />
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('pulsetrack_theme_mode');
          if (mode !== 'light' && mode !== 'dark' && mode !== 'system') mode = 'dark';
          var dark =
            mode === 'dark' ||
            (mode === 'system' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
